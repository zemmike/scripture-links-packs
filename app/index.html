<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/scripture-links-packs/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scripture Links: Bible study where the sources speak. Verses by topic, links between the Old and New Testament, and the Church Fathers. Free, no account, no ads.">
  <meta name="theme-color" content="#e08a00">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scripture Links">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Scripture Links</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #fffdf8; }
    @media (prefers-color-scheme: dark) { html, body { background: #14110c; color: #e9e2d3; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 15px system-ui, sans-serif; color: #7a6a4a; }
    #splash img { width: 72px; height: 72px; border-radius: 16px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><div>Loading Bible and notes…</div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>window.addEventListener("flutter-first-frame", function () { var e = document.getElementById("splash"); if (e) e.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
